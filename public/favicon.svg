<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Detailer figure & vehicle outline in vibrant cobalt/royal blue (#2563EB) -->
  <g stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Detailer Head -->
    <circle cx="21" cy="14" r="4.5" stroke-width="2.5" />
    
    <!-- Detailer Upper Body / Arms reaching forward with applicator/polisher -->
    <path d="M 18 19 C 14 23 13 28 15 34 C 17 38 21 38 24 35" stroke-width="2.5" />
    <path d="M 23 21 L 30 24 L 35 25" stroke-width="2.5" />
    <path d="M 19 25 L 26 29 L 32 30" stroke-width="2" />
    
    <!-- Detailer Legs (bent stance beside car) -->
    <path d="M 14 34 L 11 44 L 14 52" stroke-width="2.5" />
    <path d="M 17 35 L 17 45 L 22 52" stroke-width="2.5" />
    
    <!-- Car Roof, Rear Glass, Spoiler & Front Hood -->
    <path d="M 20 18 C 28 13 40 13 52 20 C 56 23 58 28 57 34" stroke-width="2.5" />
    <path d="M 27 15 C 36 10 47 11 55 17" stroke-width="2" />
    
    <!-- Car Front Nose, Grill & Bumper -->
    <path d="M 44 32 C 44 32 52 30 57 33 C 58 37 56 42 52 43 C 46 43 44 38 44 32 Z" stroke-width="2.2" />
    <line x1="47" y1="34" x2="55" y2="34" stroke-width="1.8" />
    <line x1="46" y1="37" x2="55" y2="37" stroke-width="1.8" />
    <line x1="47" y1="40" x2="53" y2="40" stroke-width="1.8" />
    
    <!-- Car Wheel / Rim Arch -->
    <ellipse cx="27" cy="38" rx="5" ry="10" stroke-width="2.5" />
    <ellipse cx="27" cy="38" rx="2" ry="5" stroke-width="1.5" />
    
    <!-- Car Side Body Character Line & Window -->
    <path d="M 36 26 C 39 23 44 24 46 26 C 45 29 40 30 36 26 Z" stroke-width="1.8" />
    <path d="M 25 24 C 33 26 43 27 50 28" stroke-width="1.8" />
    
    <!-- Polishing / Foam Glow Accent -->
    <circle cx="38" cy="27" r="1.5" fill="#3B82F6" stroke="none" />
    <circle cx="43" cy="27" r="1.5" fill="#3B82F6" stroke="none" />
  </g>
</svg>
